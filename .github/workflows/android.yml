name: Build Android APK

on:
  push:
    branches: [ main, pocketforge/no-code-studio ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore stable beta signing key
        env:
          BETA_KEYSTORE_B64: ${{ secrets.POCKETFORGE_BETA_KEYSTORE_B64 }}
          BETA_KEY_PASSWORD: ${{ secrets.POCKETFORGE_BETA_KEY_PASSWORD }}
        run: |
          if [[ -n "$BETA_KEYSTORE_B64" && -n "$BETA_KEY_PASSWORD" ]]; then
            printf '%s' "$BETA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pocketforge-beta.p12"
            echo "POCKETFORGE_BETA_KEYSTORE=$RUNNER_TEMP/pocketforge-beta.p12" >> "$GITHUB_ENV"
            echo "POCKETFORGE_BETA_KEY_PASSWORD=$BETA_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "POCKETFORGE_BETA_KEY_ALIAS=pocketforge-beta" >> "$GITHUB_ENV"
            echo "Stable PocketForge beta signing is enabled."
          else
            echo "Stable beta signing secrets are not configured yet; CI will use a temporary debug key for this build."
          fi

      - name: Test, lint, build and verify APK
        run: bash ci/build-android.sh

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketForge-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/app-debug.apk.cert.txt
          if-no-files-found: error

      - name: Publish green beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/app-debug.apk.sha256 \
            app/build/outputs/apk/debug/app-debug.apk.cert.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "PocketForge Build ${GITHUB_RUN_NUMBER}" \
            --notes "Green beta: unit tests, Android lint, APK assembly and signature verification passed." \
            --prerelease
